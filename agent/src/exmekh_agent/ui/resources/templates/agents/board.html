<div class="agent-workbench" data-scope="{{ scope }}">
  <aside class="agent-palette">
    <h3>Capabilities</h3>
    {% for item in catalog %}
    <button type="button" draggable="true" class="agent-palette-item"
            data-catalog="{{ item.id }}" title="{{ item.name }}" style="--node-color:{{ colors[item.kind] }}">
      <span class="agent-palette-name">{{ item.name }}</span><small>{{ item.kind.upper() }}</small>
    </button>
    {% endfor %}
  </aside>
  <div class="agent-board-area">
    <div class="agent-board-toolbar" role="group" aria-label="Board navigation">
      {% for direction, symbol in directions %}
      <button type="button" data-board-pan="{{ direction }}"
              aria-label="Pan {{ direction }}" title="Pan {{ direction }}">{{ symbol }}</button>
      {% endfor %}
      <span>Drag empty space to pan</span>
    </div>
    <div class="agent-board-viewport" tabindex="0" role="region" aria-label="Agent board">
      <div class="agent-board" data-node-width="{{ node_width }}" data-node-height="{{ node_height }}"
           data-curve-offset="{{ curve_offset }}" data-pan-step="{{ pan_step }}" style="width:{{ width }}px;height:{{ height }}px">
        <svg class="agent-board-links" width="{{ width }}" height="{{ height }}">
          {% for parent, child in connections %}
          <path data-parent="{{ parent.id }}" data-child="{{ child.id }}"
                {% if parent.kind == 'skill' %}stroke-dasharray="6 4"{% endif %}
                d="M {{ parent.x + node_width }} {{ parent.y + node_height / 2 }}
                   C {{ parent.x + node_width + curve_offset }} {{ parent.y + node_height / 2 }},
                     {{ child.x - curve_offset }} {{ child.y + node_height / 2 }},
                     {{ child.x }} {{ child.y + node_height / 2 }}"
                stroke="{{ colors[child.kind] }}" fill="none" stroke-width="2"/>
          {% endfor %}
        </svg>
        {% for item in nodes %}
        <button type="button" class="agent-board-node{% if item.id == selected_id %} selected{% endif %}"
                data-node="{{ item.id }}"
                style="left:{{ item.x }}px;top:{{ item.y }}px;--node-color:{{ colors[item.kind] }}">
          <small>{{ item.kind.upper() }}{% if item.id == root_id %} · ROOT{% endif %}</small>
          <strong>{{ item.name }}</strong>
        </button>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
