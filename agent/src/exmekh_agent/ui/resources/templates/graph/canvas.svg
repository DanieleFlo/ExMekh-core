<svg viewBox="0 0 {{ width }} {{ height }}" preserveAspectRatio="none" class="graph-star-svg w-full h-full absolute inset-0 pointer-events-none">
<defs>
<radialGradient id="constellationGlow" cx="50%" cy="45%" r="55%">
<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
<stop offset="55%" stop-color="#a855f7" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect x="0" y="0" width="{{ width }}" height="{{ height }}" fill="url(#constellationGlow)" />
{{ content }}
</svg>
