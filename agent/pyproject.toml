[project]
name = "exmekh-agent"
version = "0.1.0"
description = "Local AI Studio frontend for exmekh_lib inspired by LM Studio and Unsloth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "exmekh-lib",
    "latex2mathml>=3.81.1",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]

[tool.uv.sources]
exmekh-lib = { path = "wheels/exmekh_lib-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16.8",
]

[project.scripts]
exmekh-agent = "exmekh_agent.main:main"
sync-exmekh-lib = "exmekh_agent.sync:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-n", "auto", "--dist=loadfile", "--cov=exmekh_agent", "--cov-branch", "--cov-report=term-missing"]
markers = [
    "live: contacts a real model provider and runs only with explicit opt-in",
    "mock: live tests using the mock provider",
    "serial: requires exclusive execution after all parallel workers finish",
]

[tool.coverage.run]
branch = true
source = ["exmekh_agent"]
omit = [
    "src/exmekh_agent/main.py",
    "src/exmekh_agent/sync.py",
    "src/exmekh_agent/ui/project_settings_dialog.py",
    "src/exmekh_agent/ui/new_project_dialog.py",
    "src/exmekh_agent/ui/chat_view.py",
    "src/exmekh_agent/ui/file_icons.py",
    "src/exmekh_agent/ui/input_bar.py",
    "src/exmekh_agent/ui/markdown_parser.py",
    "src/exmekh_agent/ui/page_controller.py",
    "src/exmekh_agent/ui/raw_history_view.py",
    "src/exmekh_agent/ui/settings_drawer.py",
    "src/exmekh_agent/ui/sidebar.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
