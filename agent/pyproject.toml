[project]
name = "fe"
version = "0.1.0"
description = "Local AI Studio frontend for qs inspired by LM Studio and Unsloth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "qs",
    "latex2mathml>=3.81.1",
    "nh3>=0.3.7",
]

[tool.uv.sources]
qs = { path = "wheels/qs-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16.8",
]

[project.scripts]
fe = "fe.main:main"
sync-qs = "fe.sync:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-n", "auto", "--dist=loadfile", "--cov=fe", "--cov-branch", "--cov-report=term-missing"]
markers = [
    "live: contacts a real model provider and runs only with explicit opt-in",
    "mock: live tests using the mock provider",
    "serial: requires exclusive execution after all parallel workers finish",
]

[tool.coverage.run]
branch = true
source = ["fe"]
omit = [
    "src/fe/main.py",
    "src/fe/sync.py",
    "src/fe/ui/project_settings_dialog.py",
    "src/fe/ui/new_project_dialog.py",
    "src/fe/ui/chat_view.py",
    "src/fe/ui/file_icons.py",
    "src/fe/ui/input_bar.py",
    "src/fe/ui/markdown_parser.py",
    "src/fe/ui/page_controller.py",
    "src/fe/ui/raw_history_view.py",
    "src/fe/ui/settings_drawer.py",
    "src/fe/ui/sidebar.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
